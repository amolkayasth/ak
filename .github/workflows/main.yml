name: etlpipeline
on:
    push:
        branches:
            - main

jobs:
    extrack-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v2

            - name: run e,py
              run: python e.py

    transform-job:
        runs-on: ubuntu-latest
        needs: extrack-job

        steps:
            - name: run t.py
              run: python t.py
          
    load-job:
        runs-on: ubuntu-latest
        needs: transform-job

        steps:
            - name: run l.py
              run: python l.py        